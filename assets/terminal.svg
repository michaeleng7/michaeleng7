<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #300a24; }
      .header-bg { fill: #3c3b37; }
      .title { fill: #dfdbd2; font-family: 'Ubuntu', -apple-system, 'DejaVu Sans', sans-serif; font-size: 13px; font-weight: bold; }
      .prompt { fill: #4af626; font-family: 'Ubuntu Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; font-size: 14px; font-weight: bold; }
      .cmd { fill: #ffffff; font-family: 'Ubuntu Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; font-size: 14px; }
      .text { fill: #dfdbd2; font-family: 'Ubuntu Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; font-size: 13.5px; }
      .accent { fill: #4af626; font-weight: bold; }
      .btn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #dfdbd2; }
      .cursor {
        animation: blink 1s step-start infinite;
      }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
    </style>
    <clipPath id="terminal-clip">
      <rect width="820" height="510" rx="8" />
    </clipPath>
  </defs>

  <!-- Container principal do terminal com cantos arredondados -->
  <g clip-path="url(#terminal-clip)">
    <!-- Fundo roxo Ubuntu -->
    <rect width="820" height="510" class="bg" />

    <!-- Barra de Título do Ubuntu GNOME -->
    <rect width="820" height="36" class="header-bg" />
    <text x="18" y="23" class="title">michaeleng7@devops: ~</text>

    <!-- Botões de Controle da Janela do Ubuntu -->
    <text x="748" y="23" class="btn" font-size="14">&#8722;</text>
    <text x="770" y="22" class="btn" font-size="10">&#9634;</text>
    <text x="792" y="22" class="btn" font-size="11" fill="#ffffff" font-weight="bold">&#10005;</text>

    <!-- Linha divisória da barra de título -->
    <line x1="0" y1="36" x2="820" y2="36" stroke="#252422" stroke-width="1" />

    <!-- Prompt 1: whoami -->
    <text x="24" y="66">
      <tspan class="prompt">michaeleng7@devops:~$ </tspan>
      <tspan class="cmd">whoami --verbose</tspan>
    </text>

    <!-- Caixa 1: Profile -->
    <text x="24" y="98" class="text" xml:space="preserve">
      <tspan x="24" dy="0">┌── Profile ─────────────────────────────────────────────────────────┐</tspan>
      <tspan x="24" dy="19">│  • Name:        Michael Alves Ribeiro                              │</tspan>
      <tspan x="24" dy="19">│  • Role:        Computer Engineer &amp; DevOps Developer               │</tspan>
      <tspan x="24" dy="19">│  • Location:    Caucaia, CE - Brazil                               │</tspan>
      <tspan x="24" dy="19">│  • Core:        Python · C/C++ · Bash · Linux                      │</tspan>
      <tspan x="24" dy="19">└────────────────────────────────────────────────────────────────────┘</tspan>
    </text>

    <!-- Caixa 2: Engineering & Specializations -->
    <text x="24" y="225" class="text" xml:space="preserve">
      <tspan x="24" dy="0">┌── Engineering &amp; Specializations ───────────────────────────────────┐</tspan>
      <tspan x="24" dy="19">│  • CI/CD &amp; Cloud:     Jenkins · Gerrit · Docker · Ansible · Git    │</tspan>
      <tspan x="24" dy="19">│  • Backend &amp; AI:      FastAPI · RAG · LlamaIndex · LangChain       │</tspan>
      <tspan x="24" dy="19">│  • Embedded &amp; IoT:    FreeRTOS · RP2040 · ESP32 · MQTT · YOLO      │</tspan>
      <tspan x="24" dy="19">│  • Databases &amp; Data:  PostgreSQL · MongoDB · Pandas · Matplotlib   │</tspan>
      <tspan x="24" dy="19">└────────────────────────────────────────────────────────────────────┘</tspan>
    </text>

    <!-- Caixa 3: System Status -->
    <text x="24" y="352" class="text" xml:space="preserve">
      <tspan x="24" dy="0">┌── System Status ───────────────────────────────────────────────────┐</tspan>
      <tspan x="24" dy="19">│  <tspan class="accent">[OK]</tspan> Continuous Deployment Pipelines: OPTIMIZED                   │</tspan>
      <tspan x="24" dy="19">│  <tspan class="accent">[OK]</tspan> Microservices &amp; APIs: ACTIVE                                 │</tspan>
      <tspan x="24" dy="19">│  <tspan class="accent">[OK]</tspan> Real-Time Firmware &amp; Sensors: STABLE                         │</tspan>
      <tspan x="24" dy="19">└────────────────────────────────────────────────────────────────────┘</tspan>
    </text>

    <!-- Prompt 2 Final com Cursor Piscando -->
    <text x="24" y="474">
      <tspan class="prompt">michaeleng7@devops:~$ </tspan>
      <tspan class="cmd">./open_session.sh --links</tspan>
      <tspan class="prompt cursor"> _</tspan>
    </text>
  </g>

  <!-- Borda sutil externa da janela -->
  <rect width="820" height="510" rx="8" fill="none" stroke="#1e0416" stroke-width="2" />
</svg>

