<tspan x="24" dy="19">└────────────────────────────────────────────────────────────────────┘</tspan>
<tspan x="24" dy="32" class="prompt">michaeleng7@devops:~$ </tspan><tspan class="cmd">./open_session.sh --links</tspan><tspan class="prompt cursor"> _</tspan>
    </text>
  </g>

  <rect width="820" height="510" rx="8" fill="none" stroke="#1e0416" stroke-width="2" />
</svg>