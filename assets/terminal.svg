<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #300a24; }
      .header-bg { fill: #3c3b37; }
      .title { fill: #dfdbd2; font-family: 'Ubuntu', -apple-system, sans-serif; font-size: 13px; font-weight: bold; }
      .btn { font-family: -apple-system, sans-serif; fill: #dfdbd2; }
      .terminal-code {
        font-family: 'Ubuntu Mono', 'DejaVu Sans Mono', 'Cascadia Mono', 'Fira Code', 'Consolas', monospace;
        font-size: 13.5px;
        fill: #dfdbd2;
        letter-spacing: 0px;
      }
      .prompt { fill: #4af626; font-weight: bold; }
      .cmd { fill: #ffffff; }
      .green { fill: #4af626; }
      .cursor { animation: blink 1s step-start infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
    <clipPath id="terminal-clip">
      <rect width="820" height="510" rx="8" />
    </clipPath>
  </defs>

  <g clip-path="url(#terminal-clip)">
    <!-- Fundo roxo Ubuntu -->
    <rect width="820" height="510" class="bg" />

    <!-- Barra de Título do Ubuntu GNOME -->
    <rect width="820" height="36" class="header-bg" />
    <text x="18" y="23" class="title">michaeleng7@devops: ~</text>

    <!-- Controles da Janela -->
    <text x="748" y="23" class="btn" font-size="14">&#8722;</text>
    <text x="770" y="22" class="btn" font-size="10">&#9634;</text>
    <text x="792" y="22" class="btn" font-size="11" fill="#ffffff" font-weight="bold">&#10005;</text>

    <line x1="0" y1="36" x2="820" y2="36" stroke="#252422" stroke-width="1" />

    <!-- Prompt 1: whoami -->
    <text x="24" y="68" class="terminal-code" xml:space="preserve"><tspan class="prompt">michaeleng7@devops:~$ </tspan><tspan class="cmd">whoami --verbose</tspan></text>

    <!-- Caixas ASCII 1, 2 e 3 com Coordenadas Absolutas Imutáveis -->
    <text x="24" y="98" class="terminal-code" xml:space="preserve">┌── Profile ─────────────────────────────────────────────────────────┐</text>
    <text x="24" y="117" class="terminal-code" xml:space="preserve">│  • Name:        Michael Alves Ribeiro                              │</text>
    <text x="24" y="136" class="terminal-code" xml:space="preserve">│  • Role:        Computer Engineer &amp; DevOps Developer               │</text>
    <text x="24" y="155" class="terminal-code" xml:space="preserve">│  • Location:    Caucaia, CE - Brazil                               │</text>
    <text x="24" y="174" class="terminal-code" xml:space="preserve">│  • Core:        Python · C/C++ · Bash · Linux                      │</text>
    <text x="24" y="193" class="terminal-code" xml:space="preserve">└────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="221" class="terminal-code" xml:space="preserve">┌── Engineering &amp; Specializations ───────────────────────────────────┐</text>
    <text x="24" y="240" class="terminal-code" xml:space="preserve">│  • CI/CD &amp; Cloud:     Jenkins · Gerrit · Docker · Ansible · Git    │</text>
    <text x="24" y="259" class="terminal-code" xml:space="preserve">│  • Backend &amp; AI:      FastAPI · RAG · LlamaIndex · LangChain       │</text>
    <text x="24" y="278" class="terminal-code" xml:space="preserve">│  • Embedded &amp; IoT:    FreeRTOS · RP2040 · ESP32 · MQTT · YOLO      │</text>
    <text x="24" y="297" class="terminal-code" xml:space="preserve">│  • Databases &amp; Data:  PostgreSQL · MongoDB · Pandas · Matplotlib   │</text>
    <text x="24" y="316" class="terminal-code" xml:space="preserve">└────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="344" class="terminal-code" xml:space="preserve">┌── System Status ───────────────────────────────────────────────────┐</text>
    <text x="24" y="363" class="terminal-code" xml:space="preserve">│  <tspan class="green">[OK]</tspan> Continuous Deployment Pipelines: OPTIMIZED                   │</text>
    <text x="24" y="382" class="terminal-code" xml:space="preserve">│  <tspan class="green">[OK]</tspan> Microservices &amp; APIs: ACTIVE                                 │</text>
    <text x="24" y="401" class="terminal-code" xml:space="preserve">│  <tspan class="green">[OK]</tspan> Real-Time Firmware &amp; Sensors: STABLE                         │</text>
    <text x="24" y="420" class="terminal-code" xml:space="preserve">└────────────────────────────────────────────────────────────────────┘</text>

    <!-- Prompt 2 Final com Cursor Piscando -->
    <text x="24" y="460" class="terminal-code" xml:space="preserve"><tspan class="prompt">michaeleng7@devops:~$ </tspan><tspan class="cmd">./open_session.sh --links</tspan><tspan class="prompt cursor"> _</tspan></text>
  </g>

  <!-- Borda sutil externa da janela -->
  <rect width="820" height="510" rx="8" fill="none" stroke="#1e0416" stroke-width="2" />
</svg>